<!DOCTYPE html>
<html lang="zh-Hant">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta http-equiv="Content-Type" content="text/html; charset=utf-8">
    <title>13盧比民族風會員</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script type="text/javascript" src="https://cdn.jsdelivr.net/npm/@emailjs/browser@3/dist/email.min.js"></script>
    <style>
        body {
            background-color: #f3f4f6;
            font-family: "PingFang TC", "Heiti TC", "Microsoft JhengHei", sans-serif;
        }
        .ethnic-border { border-top: 8px solid #c2410c; }
        .accent-color { color: #c2410c; }
        .bg-accent { background-color: #c2410c; }
        .logo-container {
            width: 140px;
            height: 140px;
            border-radius: 50%;
            overflow: hidden;
            border: 2px solid #c2410c;
            display: flex;
            align-items: center;
            justify-content: center;
            background-color: white;
            margin: 0 auto;
        }
        .logo-image { width: 100%; height: 100%; object-fit: cover; }
    </style>
</head>
<body class="min-h-screen py-10 px-4">

    <div class="max-w-xl mx-auto bg-white rounded-2xl overflow-hidden shadow-2xl ethnic-border">
        <!-- 頂部視覺區 -->
        <div class="p-8 text-center bg-orange-50" id="headerBg">
            <div class="relative inline-block mb-4">
                <div class="logo-container shadow-lg">
                    <img src="./貼紙修改顏色-20251223.png" alt="13盧比民族風圖標" class="logo-image" 
                         onerror="this.onerror=null; this.src='data:image/svg+xml;charset=UTF-8,%3Csvg xmlns%3D%22http%3A%2F%2Fwww.w3.org%2F2000%2Fsvg%22 width%3D%22140%22 height%3D%22140%22 viewBox%3D%220 0 140 140%22%3E%3Ccircle cx%3D%2270%22 cy%3D%2270%22 r%3D%2270%22 fill%3D%22%23c2410c%22%2F%3E%3Ctext x%3D%2250%25%22 y%3D%2250%25%22 text-anchor%3D%22middle%22 dy%3D%22.3em%22 fill%3D%22white%22 font-size%3D%2216%22%3E13 Rupees%3C%2Ftext%3E%3C%2Fsvg%3E';">
                </div>
            </div>
            <h1 class="text-3xl font-bold text-orange-900">13盧比民族風會員</h1>
            <p class="text-orange-700/70 mt-2 italic">加入我們，體驗獨特的民族色彩</p>
        </div>

        <!-- 表單內容 -->
        <form id="membershipForm" class="p-8 space-y-5">
            <!-- 姓名與稱謂 -->
            <div class="grid grid-cols-1 md:grid-cols-4 gap-4">
                <div class="md:col-span-3">
                    <label class="block text-sm font-semibold text-gray-700 mb-1">姓名</label>
                    <input type="text" id="wechatName" name="wechatName" required class="w-full px-4 py-3 bg-gray-50 border border-gray-200 rounded-lg focus:ring-2 focus:ring-orange-500 outline-none" placeholder="請填寫您的姓名">
                </div>
                <div>
                    <label class="block text-sm font-semibold text-gray-700 mb-1">稱謂</label>
                    <select id="userTitle" name="userTitle" required class="w-full px-4 py-3 bg-gray-50 border border-gray-200 rounded-lg focus:ring-2 focus:ring-orange-500 outline-none">
                        <option value="先生">先生</option>
                        <option value="小姐">小姐</option>
                    </select>
                </div>
            </div>

            <div>
                <label class="block text-sm font-semibold text-gray-700 mb-1">行動電話</label>
                <input type="tel" id="phoneNumber" name="phoneNumber" required pattern="[0-9]{10,}" class="w-full px-4 py-3 bg-gray-50 border border-gray-200 rounded-lg focus:ring-2 focus:ring-orange-500 outline-none" placeholder="例如：0912345678">
            </div>

            <!-- 修改後的生日選單：只有月、日 -->
            <div>
                <label class="block text-sm font-semibold text-gray-700 mb-1">生日 (月/日)</label>
                <div class="grid grid-cols-2 gap-4">
                    <select id="birthMonth" name="birthMonth" required class="w-full px-4 py-3 bg-gray-50 border border-gray-200 rounded-lg focus:ring-2 focus:ring-orange-500 outline-none">
                        <option value="" disabled selected>月份</option>
                        <!-- 由 JavaScript 生成選項 -->
                    </select>
                    <select id="birthDay" name="birthDay" required class="w-full px-4 py-3 bg-gray-50 border border-gray-200 rounded-lg focus:ring-2 focus:ring-orange-500 outline-none">
                        <option value="" disabled selected>日期</option>
                        <!-- 由 JavaScript 生成選項 -->
                    </select>
                </div>
                <p class="text-xs text-gray-400 mt-1">* 僅用於提供生日優惠</p>
            </div>

            <hr class="my-6 border-gray-100">

            <div class="bg-orange-50 p-5 rounded-xl border border-orange-100">
                <h3 class="font-bold text-orange-800 mb-3">【會員權益與規定】</h3>
                <ul class="text-sm text-gray-600 space-y-2">
                    <li>• 填寫資料即可成為會員。</li>
                    <li>• 單次消費滿 <span class="accent-color font-bold">2000 元</span> 即可成為 VIP 享優惠。</li>
                    <li>• 消費滿 100 元積 1 點，滿 30 點進階成為 VIP。</li>
                    <li>• VIP 持卡平日享 <span class="font-bold">9 折</span> (特價品除外)。</li>
                    <li>• 貴賓生日當月持卡消費享 <span class="accent-color font-bold">85 折</span>。</li>
                </ul>
            </div>

            <button type="submit" id="submitBtn" class="w-full bg-accent hover:bg-orange-800 text-white font-bold py-4 rounded-xl shadow-lg transition-all active:scale-[0.98]">
                立即加入會員
            </button>
        </form>

        <div id="successMessage" class="hidden p-12 text-center">
            <div class="w-20 h-20 bg-green-100 text-green-600 rounded-full flex items-center justify-center mx-auto mb-6">
                <svg class="w-12 h-12" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                    <path stroke-linecap="round" stroke-linejoin="round" stroke-width="3" d="M5 13l4 4L19 7"></path>
                </svg>
            </div>
            <h2 class="text-2xl font-bold text-gray-800 mb-2">申請已送出！</h2>
            <p class="text-gray-500">感謝您的加入，我們已收到您的資料。</p>
            <button onclick="location.reload()" class="mt-6 text-orange-600 font-medium hover:underline">返回</button>
        </div>
    </div>

    <script>
        // 初始化 EmailJS
        (function() {
            emailjs.init("bNKauQatfjk3zowwB"); 
        })();

        // 動態生成月份與日期選項
        const monthSelect = document.getElementById('birthMonth');
        const daySelect = document.getElementById('birthDay');

        for (let i = 1; i <= 12; i++) {
            const opt = document.createElement('option');
            opt.value = i;
            opt.textContent = i + ' 月';
            monthSelect.appendChild(opt);
        }

        for (let i = 1; i <= 31; i++) {
            const opt = document.createElement('option');
            opt.value = i;
            opt.textContent = i + ' 日';
            daySelect.appendChild(opt);
        }

        document.getElementById('membershipForm').addEventListener('submit', function(e) {
            e.preventDefault();
            
            const btn = document.getElementById('submitBtn');
            btn.disabled = true;
            btn.innerText = '處理中，請稍候...';

            const fullName = document.getElementById('wechatName').value + ' ' + document.getElementById('userTitle').value;
            // 組合生日字串
            const birthDate = document.getElementById('birthMonth').value + '月' + document.getElementById('birthDay').value + '日';

            const templateParams = {
                from_name: fullName,
                phone: document.getElementById('phoneNumber').value,
                birthday: birthDate,
                email: 'u831024@gmail.com'
            };

            emailjs.send('service_bss9zeo', 'template_8k381oo', templateParams)
                .then(function(response) {
                    console.log('SUCCESS!', response.status, response.text);
                    document.getElementById('membershipForm').classList.add('hidden');
                    document.getElementById('headerBg').classList.add('hidden');
                    document.getElementById('successMessage').classList.remove('hidden');
                }, function(error) {
                    console.error('FAILED...', error);
                    alert('發送失敗，原因：' + (error.text || JSON.stringify(error)));
                    btn.disabled = false;
                    btn.innerText = '立即加入會員';
                });
        });
    </script>
</body>
</html>
