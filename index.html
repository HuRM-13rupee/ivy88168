<!DOCTYPE html>
<html lang="zh-Hant">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta http-equiv="Content-Type" content="text/html; charset=utf-8">
    <title>13盧比民族風會員</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script type="text/javascript" src="https://cdn.jsdelivr.net/npm/@emailjs/browser@3/dist/email.min.js"></script>
    <style>
        body {
            background-color: #f3f4f6; /* 頁面背景色 */
            font-family: "PingFang TC", "Heiti TC", "Microsoft JhengHei", sans-serif;
        }
        .ethnic-border { border-top: 8px solid #c2410c; }
        .accent-color { color: #c2410c; }
        .bg-accent { background-color: #c2410c; }
        
        /* 移除圓框容器限制，讓圖示直接呈現 */
        .logo-wrapper {
            width: 180px;
            height: 180px;
            margin: 0 auto;
            display: flex;
            align-items: center;
            justify-content: center;
            position: relative;
            z-index: 10;
        }
        
        /* 讓圖示放大並直接顯示於最上層 */
        .logo-image { 
            width: 100%; 
            height: 100%; 
            object-fit: contain; 
            display: block;
            transform: scale(1.3); /* 放大呈現 */
            /* 關鍵：使用 multiply 混合模式將圖片中的白色背景過濾掉，使其與下方背景同色 */
            mix-blend-mode: multiply;
            filter: drop-shadow(0 4px 6px rgba(0,0,0,0.1)); 
        }
    </style>
</head>
<body class="min-h-screen py-10 px-4">

    <!-- 將容器背景改為與 body 一致的透明或灰色 (f3f4f6) -->
    <div class="max-w-xl mx-auto bg-[#f3f4f6] rounded-2xl overflow-hidden ethnic-border">
        <!-- 頂部視覺區：調整背景色以符合整體感 -->
        <div class="p-8 text-center" id="headerBg">
            <div class="relative inline-block mb-6">
                <div class="logo-wrapper">
                    <img src="./貼紙修改顏色-20251223.png" alt="13盧比民族風圖標" class="logo-image" 
                         onerror="this.onerror=null; this.src='data:image/svg+xml;charset=UTF-8,%3Csvg xmlns%3D%22http%3A%2F%2Fwww.w3.org%2F2000%2Fsvg%22 width%3D%22140%22 height%3D%22140%22 viewBox%3D%220 0 140 140%22%3E%3Ctext x%3D%2250%25%22 y%3D%2250%25%22 text-anchor%3D%22middle%22 dy%3D%22.3em%22 fill%3D%22%23c2410c%22 font-size%3D%2224%22 font-weight%3D%22bold%22%3E13 Rupees%3C%2Ftext%3E%3C%2Fsvg%3E';">
                </div>
            </div>
            <h1 class="text-3xl font-bold text-orange-900 mt-4">13盧比民族風會員</h1>
            <p class="text-orange-700/70 mt-2 italic">加入我們，體驗獨特的民族色彩</p>
        </div>

        <!-- 表單內容：移除白色背景，使用與頁面相同的底色 -->
        <form id="membershipForm" class="p-8 space-y-5">
            <!-- 姓名與稱謂 -->
            <div class="grid grid-cols-1 md:grid-cols-4 gap-4">
                <div class="md:col-span-3">
                    <label class="block text-sm font-semibold text-gray-700 mb-1">姓名</label>
                    <input type="text" id="wechatName" name="wechatName" required class="w-full px-4 py-3 bg-white border border-gray-300 rounded-lg focus:ring-2 focus:ring-orange-500 outline-none shadow-sm" placeholder="請填寫您的姓名">
                </div>
                <div>
                    <label class="block text-sm font-semibold text-gray-700 mb-1">稱謂</label>
                    <select id="userTitle" name="userTitle" required class="w-full px-4 py-3 bg-white border border-gray-300 rounded-lg focus:ring-2 focus:ring-orange-500 outline-none shadow-sm">
                        <option value="先生">先生</option>
                        <option value="小姐">小姐</option>
                    </select>
                </div>
            </div>

            <div>
                <label class="block text-sm font-semibold text-gray-700 mb-1">行動電話</label>
                <input type="tel" id="phoneNumber" name="phoneNumber" required pattern="[0-9]{10,}" class="w-full px-4 py-3 bg-white border border-gray-300 rounded-lg focus:ring-2 focus:ring-orange-500 outline-none shadow-sm" placeholder="例如：0912345678">
            </div>

            <!-- 生日選單 -->
            <div>
                <label class="block text-sm font-semibold text-gray-700 mb-1">生日 (月/日)</label>
                <div class="grid grid-cols-2 gap-4">
                    <select id="birthMonth" name="birthMonth" required class="w-full px-4 py-3 bg-white border border-gray-300 rounded-lg focus:ring-2 focus:ring-orange-500 outline-none shadow-sm">
                        <option value="" disabled selected>月份</option>
                    </select>
                    <select id="birthDay" name="birthDay" required class="w-full px-4 py-3 bg-white border border-gray-300 rounded-lg focus:ring-2 focus:ring-orange-500 outline-none shadow-sm">
                        <option value="" disabled selected>日期</option>
                    </select>
                </div>
                <p class="text-xs text-gray-400 mt-1">* 僅用於提供生日優惠</p>
            </div>

            <hr class="my-6 border-gray-300">

            <!-- 權益說明區塊 -->
            <div class="bg-orange-100/50 p-5 rounded-xl border border-orange-200">
                <h3 class="font-bold text-orange-800 mb-3 flex items-center">
                    <span class="mr-2">📜</span> 【會員權益與規定】
                </h3>
                <ul class="text-sm text-gray-600 space-y-2 leading-relaxed">
                    <li>• 填寫資料即可成為會員。</li>
                    <li>• 單次消費滿 <span class="font-bold accent-color text-base">2000 元</span> 即可成為 VIP 及享貴賓優惠。</li>
                    <li>• 會員消費滿 100 元即可累積 1 點，累積 30 點即可進階成為 VIP 及享貴賓優惠。</li>
                    <li>• 持 VIP 卡消費享有 <span class="font-bold text-gray-800">平日 9 折</span> (特價品除外)。</li>
                    <li>• 貴賓卡生日當月持卡消費享有 <span class="font-bold accent-color">85 折</span>。</li>
                </ul>
            </div>

            <div class="flex items-start mt-4">
                <input id="terms" type="checkbox" required class="mt-1 w-4 h-4 text-orange-600 border-gray-300 rounded focus:ring-orange-500">
                <label for="terms" class="ml-2 text-xs text-gray-500">
                    我已閱讀並同意上述會員權益與規定。
                </label>
            </div>

            <button type="submit" id="submitBtn" class="w-full bg-accent hover:bg-orange-800 text-white font-bold py-4 rounded-xl shadow-lg transition-all active:scale-[0.98]">
                立即加入會員
            </button>
        </form>

        <div id="successMessage" class="hidden p-12 text-center">
            <div class="w-20 h-20 bg-green-100 text-green-600 rounded-full flex items-center justify-center mx-auto mb-6">
                <svg class="w-12 h-12" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                    <path stroke-linecap="round" stroke-linejoin="round" stroke-width="3" d="M5 13l4 4L19 7"></path>
                </svg>
            </div>
            <h2 class="text-2xl font-bold text-gray-800 mb-2">申請已送出！</h2>
            <p class="text-gray-500">感謝您的加入，我們已收到您的資料。</p>
            <button onclick="location.reload()" class="mt-6 text-orange-600 font-medium hover:underline">返回</button>
        </div>
    </div>

    <script>
        (function() {
            emailjs.init("bNKauQatfjk3zowwB"); 
        })();

        const monthSelect = document.getElementById('birthMonth');
        const daySelect = document.getElementById('birthDay');

        for (let i = 1; i <= 12; i++) {
            const opt = document.createElement('option');
            opt.value = i;
            opt.textContent = i + ' 月';
            monthSelect.appendChild(opt);
        }

        for (let i = 1; i <= 31; i++) {
            const opt = document.createElement('option');
            opt.value = i;
            opt.textContent = i + ' 日';
            daySelect.appendChild(opt);
        }

        document.getElementById('membershipForm').addEventListener('submit', function(e) {
            e.preventDefault();
            
            const btn = document.getElementById('submitBtn');
            btn.disabled = true;
            btn.innerText = '處理中，請稍候...';

            const fullName = document.getElementById('wechatName').value + ' ' + document.getElementById('userTitle').value;
            const birthDate = document.getElementById('birthMonth').value + '月' + document.getElementById('birthDay').value + '日';

            const templateParams = {
                from_name: fullName,
                phone: document.getElementById('phoneNumber').value,
                birthday: birthDate,
                email: 'u831024@gmail.com'
            };

            emailjs.send('service_bss9zeo', 'template_8k381oo', templateParams)
                .then(function(response) {
                    document.getElementById('membershipForm').classList.add('hidden');
                    document.getElementById('headerBg').classList.add('hidden');
                    document.getElementById('successMessage').classList.remove('hidden');
                }, function(error) {
                    alert('發送失敗，原因：' + (error.text || JSON.stringify(error)));
                    btn.disabled = false;
                    btn.innerText = '立即加入會員';
                });
        });
    </script>
</body>
</html>
