<!DOCTYPE html>
<html lang="zh-Hant">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>VIP 會員加入</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- 引入 EmailJS SDK -->
    <script type="text/javascript" src="https://cdn.jsdelivr.net/npm/@emailjs/browser@3/dist/email.min.js"></script>
    <style>
        body {
            background-color: #f8fafc;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
        }
        .form-card {
            box-shadow: 0 10px 25px -5px rgba(0, 0, 0, 0.1), 0 8px 10px -6px rgba(0, 0, 0, 0.1);
        }
        .gradient-bg {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
        }
    </style>
</head>
<body class="min-h-screen flex items-center justify-center p-4">

    <div class="max-w-md w-full bg-white rounded-3xl overflow-hidden form-card">
        <!-- 頂部圖示區 -->
        <div class="gradient-bg p-8 text-center text-white" id="headerBg">
            <div class="inline-flex items-center justify-center w-20 h-20 bg-white/20 rounded-full mb-4">
                <svg viewBox="0 0 24 24" class="w-12 h-12 fill-current" xmlns="http://www.w3.org/2000/svg">
                    <path d="M12 2C6.48 2 2 6.48 2 12s4.48 10 10 10 10-4.48 10-10S17.52 2 12 2zm0 18c-4.41 0-8-3.59-8-8s3.59-8 8-8 8 3.59 8 8-3.59 8-8 8zm-1-13h2v6h-2zm0 8h2v2h-2z"/>
                    <circle cx="12" cy="12" r="3" fill="none" stroke="currentColor" stroke-width="2" stroke-dasharray="2,2" />
                </svg>
            </div>
            <h1 class="text-2xl font-bold tracking-tight">VIP 尊享會員</h1>
            <p class="text-white/80 mt-1">請填寫下方資料完成加入</p>
        </div>

        <!-- 表單內容 -->
        <form id="membershipForm" class="p-8 space-y-6">
            <!-- 姓名/微信名 -->
            <div>
                <label class="block text-sm font-medium text-gray-700 mb-1">姓名 / 微信名</label>
                <input type="text" id="wechatName" name="wechatName" required 
                    class="w-full px-4 py-3 bg-gray-50 border border-gray-200 rounded-xl focus:ring-2 focus:ring-purple-500 outline-none" 
                    placeholder="請輸入您的暱稱">
            </div>

            <!-- 行動電話 -->
            <div>
                <label class="block text-sm font-medium text-gray-700 mb-1">行動電話</label>
                <input type="tel" id="phoneNumber" name="phoneNumber" required pattern="[0-9]{10,}"
                    class="w-full px-4 py-3 bg-gray-50 border border-gray-200 rounded-xl focus:ring-2 focus:ring-purple-500 outline-none" 
                    placeholder="請輸入電話號碼">
            </div>

            <!-- 生日 -->
            <div>
                <label class="block text-sm font-medium text-gray-700 mb-1">生日</label>
                <input type="date" id="birthday" name="birthday" required 
                    class="w-full px-4 py-3 bg-gray-50 border border-gray-200 rounded-xl focus:ring-2 focus:ring-purple-500 outline-none">
            </div>

            <!-- 其他備註 -->
            <div>
                <label class="block text-sm font-medium text-gray-700 mb-1">備註 (選填)</label>
                <textarea id="notes" name="notes" rows="3" 
                    class="w-full px-4 py-3 bg-gray-50 border border-gray-200 rounded-xl focus:ring-2 focus:ring-purple-500 outline-none resize-none" 
                    placeholder="其他相關資訊..."></textarea>
            </div>

            <button type="submit" id="submitBtn"
                class="w-full gradient-bg text-white font-bold py-4 rounded-xl shadow-lg hover:opacity-90 transition-all flex items-center justify-center">
                立即加入會員
            </button>
        </form>

        <!-- 成功訊息 -->
        <div id="successMessage" class="hidden p-10 text-center space-y-4">
            <div class="w-20 h-20 bg-green-100 text-green-600 rounded-full flex items-center justify-center mx-auto">
                <svg class="w-12 h-12" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                    <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M5 13l4 4L19 7"></path>
                </svg>
            </div>
            <h2 class="text-2xl font-bold text-gray-800">註冊成功！</h2>
            <p class="text-gray-500">感謝您的加入，資料已送出。</p>
            <button onclick="location.reload()" class="text-purple-600 font-medium hover:underline">返回</button>
        </div>
    </div>

    <script>
        // 初始化 EmailJS
        (function() {
            emailjs.init("bNKauQatfjk3zowwB"); 
        })();

        document.getElementById('membershipForm').addEventListener('submit', function(e) {
            e.preventDefault();
            
            const btn = document.getElementById('submitBtn');
            btn.disabled = true;
            btn.innerHTML = '處理中...';

            // 這裡的 Key 必須與 EmailJS Template 裡的 {{ }} 一致
            const templateParams = {
                from_name: document.getElementById('wechatName').value,
                phone: document.getElementById('phoneNumber').value,
                birthday: document.getElementById('birthday').value,
                email: 'u831024@gmail.com', // 這裡指的是收件人的標記，或可在後台直接寫死
                notes: document.getElementById('notes').value
            };

            // 使用您提供的 ID
            emailjs.send('service_bss9zeo', 'template_8k381oo', templateParams)
                .then(function() {
                    document.getElementById('membershipForm').classList.add('hidden');
                    document.getElementById('headerBg').classList.add('hidden');
                    document.getElementById('successMessage').classList.remove('hidden');
                }, function(error) {
                    alert('發送失敗: ' + JSON.stringify(error));
                    btn.disabled = false;
                    btn.innerHTML = '立即加入會員';
                });
        });
    </script>
</body>
</html>
